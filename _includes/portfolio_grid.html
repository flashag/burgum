<section id="portfolio" class="catalog" aria-labelledby="games-title">
  <div class="section-heading">
    <h2 id="games-title">Our games</h2>
    <span class="muted">{{ site.posts | size }} games</span>
  </div>
  <div class="game-grid">
    {% assign catalog = site.posts | sort: 'release_order' | reverse %}
    {% for post in catalog %}
      {% include game_card.html post=post %}
    {% endfor %}
  </div>
</section>
