<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title }}</title>
  <meta name="viewport" content="width=device-width">
  {% assign head_game = site.data.steam[page.steam_id] %}
  {% assign head_description = page.description | split: '<a ' | first | split: '<br' | first | strip_html %}
  <meta name="description" content="{{ head_game.short_description | default: head_description | default: site.description | escape }}">
  <meta name="keywords" content="{{ site.keywords }}" />
  {% if site.meta_author %}
  <meta name="author" content="{{ site.meta_author }}">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/burgumgames_fav.png' | relative_url }}" type="image/png">

  <!-- Site styles -->
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <!--<link rel="stylesheet" href="{{ " style.css" }}">-->

  <!-- Google verification -->
  {% if site.google_verify %}
  <meta name="google-site-verification" content="{{ site.google_verify }}">{% endif %}

  <!-- Bing Verification -->
  {% if site.bing_verify %}
  <meta name="msvalidate.01" content="{{ site.bing_verify }}">{% endif %}


  <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
  <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
  <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
