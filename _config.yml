# Site settings
title: BurGum Games
email: hello@burgumgames.com
url: https://burgumgames.com
baseurl: ""
description: "An independent game studio of two. We make games we want to play."
keywords: "indie game, gamedev, steam, game development"
skills: "Indie game developer"
meta_author: Artem Gumennikov

# Collection setting
collections:
  pages:
    output: true

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form:
# - static : pass through formspree.io to validate email sending
# - disqus : replace contact form by disqus thread
# - comment the line below if you want to stick with the default PHP contact form
contact: static

# If you use disqus you need disqus shortname
# https://help.disqus.com/customer/portal/articles/466208
disqus_shortname: myshortname

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: 18bc9c #80B3FF
  primary-rgb: "24,288,156" #"128,179,255"
  secondary: 2c3e50 #FD6E8A
  secondary-dark: 233140 #A2122F

# Footer settings
footer:
  copyright: BurGum Games
  location: Location
  social: Follow me
  credits: More

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: twitter
    url: https://www.threads.net/@artem_gumennikov
  - title: steam
    url: https://store.steampowered.com/curator/45054438-BurGum-Games/
  - title: discord
    url: https://discord.gg/8tCnUDsfr3

# Postal address (add as many lines as necessary)
address:
  - line: Portugal
  - line: Madeira

# Credits content
credits: 'Coming soon...'

# Build settings
markdown: kramdown
permalink: pretty
exclude:
  - AGENTS.md
  - .agent
  - scripts
  - tests
  - README.md
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - freelancer-theme-jekyll.gemspec

#for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: ""
